[project]
name = "ai-engineer-cli"
version = "0.1.0"
description = "Interactive AI Engineer REPL with guarded workspace tools"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "West AI Labs" }]
dependencies = [
  "typer>=0.15.0",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[project.scripts]
aie = "ai_engineer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_engineer"]

[tool.hatch.build.targets.wheel.sources]
"src/ai_engineer" = "ai_engineer"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.uv]
package = true
