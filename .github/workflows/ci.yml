name: CI

"on":
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --extra dev --locked
      - name: Lint
        run: uv run --with ruff==0.17.5 ruff check src tests
      - name: Format check
        run: uv run --with ruff==0.17.5 ruff format --check src tests
      - name: Test
        run: uv run pytest -q
